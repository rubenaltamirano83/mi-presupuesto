<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Mi Presupuesto</title><link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f4f7f6;--card:#fff;--text:#17302d;--muted:#6b7c79;--accent:#0f766e;--accent2:#dff5f1;--danger:#b42318;--line:#e3eae8;--shadow:0 10px 30px rgba(23,48,45,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.app{max-width:720px;margin:auto;padding:18px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:25px;font-weight:800;letter-spacing:-.5px}.subtitle{font-size:13px;color:var(--muted);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.balance{background:linear-gradient(145deg,#0f766e,#159786);color:white;border:0;padding:22px}.balance small{opacity:.8;font-size:13px}.balance h1{font-size:39px;letter-spacing:-1.5px;margin:5px 0 16px}.stats{display:flex;gap:12px}.stat{flex:1;background:rgba(255,255,255,.14);border-radius:15px;padding:11px}.stat span{display:block;font-size:12px;opacity:.78}.stat strong{font-size:16px}
h2{font-size:18px;margin:0 0 15px}.grid{display:grid;grid-template-columns:1fr 110px;gap:12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px;font-size:16px;background:#fbfcfc;color:var(--text);outline:none}.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
button{border:0;border-radius:14px;padding:14px 17px;font-size:15px;font-weight:750;cursor:pointer}.primary{width:100%;background:var(--accent);color:#fff;margin-top:14px}.secondary{background:#edf3f2;color:var(--text)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.total{font-size:22px;font-weight:800}.muted{color:var(--muted);font-size:13px}.items{display:flex;flex-direction:column;gap:10px}.item{border:1px solid var(--line);border-radius:17px;padding:14px;display:flex;align-items:center;gap:12px}.item-main{min-width:0;flex:1}.item-name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-meta{font-size:12px;color:var(--muted);margin-top:4px}.item-price{text-align:right;font-weight:800}.delete{background:#fff1f0;color:var(--danger);padding:9px 11px;font-size:13px}.empty{text-align:center;padding:25px 8px;color:var(--muted)}.warning{color:#9a6700}.negative{background:linear-gradient(145deg,#a33b32,#c14c40)}.budget-row{display:flex;gap:10px}.budget-row input{flex:1}.budget-row button{background:var(--accent);color:#fff}.modal{position:fixed;inset:0;background:rgba(10,25,23,.45);display:none;align-items:flex-end;justify-content:center;padding:12px}.modal.show{display:flex}.sheet{background:white;border-radius:24px;padding:22px;width:min(700px,100%);box-shadow:0 -10px 40px rgba(0,0,0,.18)}.sheet h3{margin:0 0 8px}.sheet p{color:var(--muted);font-size:14px}.sheet-actions{display:flex;gap:10px;margin-top:16px}.sheet-actions button{flex:1}
@media(min-width:600px){.app{padding-top:35px}.modal{align-items:center}.sheet{width:500px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="brand">Mi Presupuesto</div><div class="subtitle">Tu carrito, bajo control.</div></div>
    <button class="secondary" id="resetBtn">Nueva compra</button>
  </div>

  <section class="card" id="budgetCard">
    <h2>¿Cuánto planeás gastar?</h2>
    <div class="budget-row">
      <input id="budgetInput" type="number" min="0" step="100" inputmode="decimal" placeholder="Ej. 150000">
      <button id="startBtn">Comenzar</button>
    </div>
  </section>

  <section class="card balance" id="balanceCard" style="display:none">
    <small>SALDO DISPONIBLE</small>
    <h1 id="balance">$0</h1>
    <div class="stats">
      <div class="stat"><span>Presupuesto</span><strong id="budgetLabel">$0</strong></div>
      <div class="stat"><span>Gastado</span><strong id="spent">$0</strong></div>
    </div>
  </section>

  <section class="card" id="productCard" style="display:none">
    <h2>Agregar producto</h2>
    <div class="grid">
      <div class="field full"><label>Producto</label><input id="name" placeholder="Ej. Leche"></div>
      <div class="field"><label>Precio por unidad</label><input id="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="$ 0"></div>
      <div class="field"><label>Cantidad</label><input id="qty" type="number" min="1" step="1" value="1" inputmode="numeric"></div>
      <div class="field full"><label>Descuento</label>
        <select id="discount">
          <option value="none">Sin descuento</option>
          <option value="5">5% de descuento</option>
          <option value="10">10% de descuento</option>
          <option value="20">20% de descuento</option>
          <option value="30">30% de descuento</option>
          <option value="50">50% de descuento</option>
          <option value="70">70% de descuento</option>
          <option value="second50">50% en la segunda unidad</option>
          <option value="second70">70% en la segunda unidad</option>
          <option value="second80">80% en la segunda unidad</option>
          <option value="2x1">2 × 1</option>
          <option value="3x2">3 × 2</option>
          <option value="4x3">4 × 3</option>
        </select>
      </div>
    </div>
    <button class="primary" id="addBtn">+ Agregar al carrito</button>
  </section>

  <section class="card" id="listCard" style="display:none">
    <div class="row" style="margin-bottom:14px"><div><h2 style="margin:0">Mi carrito</h2><div class="muted" id="count">0 productos</div></div><div class="total" id="cartTotal">$0</div></div>
    <div class="items" id="items"></div>
  </section>
</div>

<div class="modal" id="modal">
 <div class="sheet">
  <h3>¿Empezar una nueva compra?</h3>
  <p>Se eliminarán los productos de la compra actual.</p>
  <div class="sheet-actions"><button class="secondary" id="cancel">Cancelar</button><button class="primary" id="confirm" style="margin:0">Nueva compra</button></div>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);
let state=JSON.parse(localStorage.getItem("miPresupuesto")||"null")||{budget:0,items:[]};

function money(n){return new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n)}
function calc(price,qty,type){
  const subtotal=price*qty;
  if(type==="none") return subtotal;
  if(type==="second50") return price*(qty-Math.floor(qty/2)*0.5);
  if(type==="second70") return price*(qty-Math.floor(qty/2)*0.7);
  if(type==="second80") return price*(qty-Math.floor(qty/2)*0.8);
  if(type==="2x1") return price*(qty-Math.floor(qty/2));
  if(type==="3x2") return price*(qty-Math.floor(qty/3));
  if(type==="4x3") return price*(qty-Math.floor(qty/4));
  return subtotal*(1-Number(type)/100);
}
function label(type){
 const map={none:"Sin descuento",second50:"50% en 2ª unidad",second70:"70% en 2ª unidad",second80:"80% en 2ª unidad","2x1":"2 × 1","3x2":"3 × 2","4x3":"4 × 3"};
 return map[type]||type+"% de descuento";
}
function save(){localStorage.setItem("miPresupuesto",JSON.stringify(state))}
function render(){
 const active=state.budget>0;
 $("budgetCard").style.display=active?"none":"block";
 $("balanceCard").style.display=active?"block":"none";
 $("productCard").style.display=active?"block":"none";
 $("listCard").style.display=active?"block":"none";
 if(!active)return;
 const spent=state.items.reduce((s,i)=>s+i.total,0), balance=state.budget-spent;
 $("balance").textContent=money(balance);
 $("balanceCard").classList.toggle("negative",balance<0);
 $("budgetLabel").textContent=money(state.budget);
 $("spent").textContent=money(spent);
 $("cartTotal").textContent=money(spent);
 $("count").textContent=state.items.length+" producto"+(state.items.length===1?"":"s");
 $("items").innerHTML=state.items.length?state.items.map(i=>`
 <div class="item">
  <div class="item-main"><div class="item-name">${escapeHtml(i.name)}</div><div class="item-meta">${i.qty} × ${money(i.price)} · ${label(i.discount)}</div></div>
  <div class="item-price">${money(i.total)}</div>
  <button class="delete" onclick="removeItem('${i.id}')">Eliminar</button>
 </div>`).join(""):`<div class="empty">Todavía no agregaste productos.<br>Empezá con lo que tengas en el carrito.</div>`;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
$("startBtn").onclick=()=>{
 const b=Number($("budgetInput").value);
 if(!b||b<=0)return alert("Ingresá un presupuesto válido.");
 state={budget:b,items:[]};save();render();$("name").focus();
};
$("addBtn").onclick=()=>{
 const name=$("name").value.trim(),price=Number($("price").value),qty=Number($("qty").value),discount=$("discount").value;
 if(!name||price<0||!qty||qty<1)return alert("Completá producto, precio y cantidad.");
 const total=calc(price,qty,discount);
 state.items.push({id:Date.now().toString(),name,price,qty,discount,total});save();render();
 $("name").value="";$("price").value="";$("qty").value=1;$("discount").value="none";$("name").focus();
};
window.removeItem=id=>{state.items=state.items.filter(i=>i.id!==id);save();render()};
$("resetBtn").onclick=()=>{$("modal").classList.add("show")};
$("cancel").onclick=()=>{$("modal").classList.remove("show")};
$("confirm").onclick=()=>{state={budget:0,items:[]};save();$("modal").classList.remove("show");$("budgetInput").value="";render()};
$("price").addEventListener("keydown",e=>{if(e.key==="Enter")$("addBtn").click()});
render();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js")}</script></body>
</html>
